<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOV Atlas — mockup</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eef1f5; --text:#16191f; --muted:#5d6675;
  --border:#d9dee6; --accent:#2a63d6; --accent-soft:#e3ecfc; --warn-bg:#fff6dc; --warn:#7a5a00;
  --grid:#c9d0da; --ceiling:#8a93a3;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --surface:#1a1e24; --surface-2:#232830; --text:#e8ebf0; --muted:#9aa3b2;
    --border:#2f3540; --accent:#6d9bff; --accent-soft:#1f2b45; --warn-bg:#2e2710; --warn:#e9c766;
    --grid:#3a414d; --ceiling:#7d8697; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1a1e24; --surface-2:#232830; --text:#e8ebf0; --muted:#9aa3b2;
  --border:#2f3540; --accent:#6d9bff; --accent-soft:#1f2b45; --warn-bg:#2e2710; --warn:#e9c766;
  --grid:#3a414d; --ceiling:#7d8697; color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;text-decoration:none;color:var(--text)}
.brand span{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--muted)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.mockflag{margin-left:auto;font-size:12px;background:var(--warn-bg);color:var(--warn);padding:3px 8px;border-radius:6px}
main{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:28px;margin:0 0 6px} h2{font-size:20px;margin:28px 0 10px} h3{font-size:16px;margin:18px 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.side{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid2,.side{grid-template-columns:minmax(0,1fr)}}
.home-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:24px}
.big{display:block;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;color:var(--text);font:inherit;text-decoration:none}
.big:hover{border-color:var(--accent)}
.big b{display:block;font-size:18px;margin-bottom:4px}
.big .ic{font-size:26px;display:block;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--text);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;flex:1 1 auto}
.seg button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fgroup{margin-bottom:14px} .fgroup>.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;background:var(--surface-2)}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.radar{width:100%;max-width:560px;display:block;margin:0 auto}
.toolbar{display:flex;flex-wrap:wrap;gap:0 24px;align-items:flex-end}
.pick+th,.pick+td{text-align:left}
.pick{width:1%;padding-right:0;cursor:pointer} .pick input{cursor:pointer;width:16px;height:16px;vertical-align:middle}
.pickbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom, 0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;padding:10px 14px;border:1px solid var(--accent);border-radius:12px;background:var(--surface);box-shadow:0 6px 20px rgba(0,0,0,.15)}
.pickbar .names{flex:1 1 200px}
.card.big{position:fixed;inset:calc(10px + env(safe-area-inset-top, 0px)) 10px calc(10px + env(safe-area-inset-bottom, 0px));z-index:20;overflow:auto;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
.card.big .radar{max-width:none;width:min(100%, calc(100vh - 170px))}
.viewbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:13px;margin-top:8px}
.legend svg{vertical-align:middle;margin-right:6px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px}
.steps{display:flex;flex-direction:column;gap:4px}
.steps button{text-align:left;border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer}
.steps button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.steps button.done{color:var(--text)}
input[type=number],input[type=text],textarea,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
textarea{width:100%;min-height:70px;font-family:ui-monospace,monospace;font-size:12px}
.eyegrid{display:grid;grid-template-columns:repeat(3,72px);gap:6px;justify-content:center}
.eyegrid input{width:72px;text-align:center}
.eyegrid .c{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.fit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fitopt{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--surface);cursor:pointer;text-align:center;font:inherit;color:var(--text)}
.fitopt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fitopt svg{width:100%;height:70px}
pre{background:var(--surface-2);border-radius:8px;padding:10px;overflow-x:auto;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:700} .kpi .l{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-left:4px}
.prose p,.prose li{max-width:72ch}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="#home">FOV <span>Atlas</span></a>
  <nav id="nav"></nav>
  <span class="mockflag">Mockup · sample data</span>
</div></header>
<main id="app"></main>

<script>
/* ---------- Static model ---------- */
const DIRS = [['R',0],['UR',45],['U',90],['UL',135],['L',180],['DL',225],['D',270],['DR',315]];
const DIR_NAME = {R:'right',UR:'up-right',U:'up',UL:'up-left',L:'left',DL:'down-left',D:'down',DR:'down-right'};
const TOOLS = {
  ATLAS: {name:'FOV Atlas',         dash:'',    dirs:{L:DIRS.map(([dir])=>dir), R:DIRS.map(([dir])=>dir)}, step:0.1},
  VRHP:  {name:'VR Headset Picker', dash:'',    dirs:{L:['L','R','U','D','DL'], R:['L','R','U','D','UR']}, step:0.01},
  WIMFOV:{name:'WIMFOV',            dash:'7 5', dirs:{L:DIRS.map(([dir])=>dir), R:DIRS.map(([dir])=>dir)}, step:1},
  /* TestHMD moves the dot out on both sides at once with both eyes open: one horizontal and one vertical angle,
     stored as the outer edge of each eye's side so the binocular figures still work. */
  TESTHMD:{name:'TestHMD',          dash:'10 4 2 4', dirs:{L:['L','U','D'], R:['R','U','D']}, step:0.5, binocular:true},
};
const TOOL_NAMES = Object.fromEntries(Object.entries(TOOLS).map(([key,tool])=>[key,tool.name]));

/* A profile is written from one eye's point of view (temporal/nasal); leftEye/rightEye place it in the head frame. */
function mk(temp,nasal,up,down,over={}){
  return Object.assign({temp,nasal,up,down,
    dut:Math.round((temp+up)*0.53), ddt:Math.round((temp+down)*0.55),
    dun:Math.round((nasal+up)*0.5), ddn:Math.round((nasal+down)*0.52)}, over);
}
const leftEye  = (profile)=>({L:profile.temp,R:profile.nasal,U:profile.up,D:profile.down,UL:profile.dut,DL:profile.ddt,UR:profile.dun,DR:profile.ddn});
const rightEye = (profile)=>({R:profile.temp,L:profile.nasal,U:profile.up,D:profile.down,UR:profile.dut,DR:profile.ddt,UL:profile.dun,DL:profile.ddn});
const sym = (profile)=>({L:profile,R:profile});

const HEADSETS = [
  {id:'beyond2', name:'Bigscreen Beyond 2', color:'#2a78d6',
   rendered:mk(55,42,44.2,54,{ddt:63,dut:56}),
   peak:{VRHP:{L:mk(55,42,43,53.9,{ddt:59}), R:mk(54.3,41.5,44.2,52.5,{dut:52})},
         WIMFOV:{L:mk(54,40,41,52,{ddt:62}), R:mk(52,41,42,51)},
         ATLAS:{L:mk(54.6,41.6,42.7,53.1,{ddt:60.4}), R:mk(53.8,41.2,43.6,52)},
         TESTHMD:{L:mk(53.5,40.5,41.5,52), R:mk(53,40.5,42.5,51)}}},
  {id:'dreamair', name:'Pimax Dream Air', color:'#d9622b',
   rendered:mk(55.08,45.54,44.55,44.55), diag:{full:120.17, masked:114.30},
   peak:{VRHP:sym(mk(54.6,45,44,44)), WIMFOV:sym(mk(54,44,43,43)), ATLAS:sym(mk(54.8,45.2,44.2,44.2)), TESTHMD:sym(mk(53.5,44,42.5,42.5))}},
  {id:'quest3', name:'Meta Quest 3', color:'#1f9e77',
   rendered:mk(52,45,46,50), peak:{TESTHMD:sym(mk(49.5,43.5,42.5,47)), VRHP:sym(mk(50,44,43,48)), WIMFOV:sym(mk(49,43,42,47)), ATLAS:sym(mk(49.6,43.5,42.6,47.4))}},
  {id:'crystal', name:'Pimax Crystal Light', color:'#a347c2',
   rendered:mk(62,50,54,58), peak:{VRHP:sym(mk(60,48,52,56)), WIMFOV:sym(mk(58,47,50,54))}},
  {id:'index', name:'Valve Index', color:'#b8901b',
   rendered:mk(60,46,52,54), peak:{VRHP:sym(mk(58,45,50,52))}},
];
const headsetById = Object.fromEntries(HEADSETS.map((headset)=>[headset.id,headset]));

/* The corner mask leaves the edges alone and trims the diagonals, so the masked reference shrinks only those,
   by the ratio of the model's two binocular diagonal figures. Models without both figures have one reference. */
for(const headset of HEADSETS) if(headset.diag){
  const ratio = headset.diag.masked/headset.diag.full, profile = headset.rendered;
  headset.renderedMasked = {...profile, dut:profile.dut*ratio, ddt:profile.ddt*ratio, dun:profile.dun*ratio, ddn:profile.ddn*ratio};
}
const MASK_HINT = 'Corner mask: many headsets skip drawing the corners the lens hides anyway, which trims the diagonal a little.';
const modelCeiling = (headset,mask)=> mask==='on'&&headset.renderedMasked ? headset.renderedMasked : headset.rendered;
function modelTotals(headset,mask){
  const profile = modelCeiling(headset,mask);
  const diag = headset.diag ? (mask==='on'?headset.diag.masked:headset.diag.full) : profile.dut+profile.ddt;
  return {H:profile.temp*2, V:profile.up+profile.down, diag};
}
/* Each tool defines the diagonal slightly differently, so only a clear excess over the masked figure counts. */
const linkMask = (headset,totals)=> headset.diag && totals.diag > headset.diag.masked+3 ? 'off' : 'unknown';
/* Per-eye ceiling profiles of a submission: its own when measured, the model's otherwise. */
function ceilingProfiles(sub){
  const headset = headsetById[sub.headset], ceiling = sub.ceiling, reference = modelCeiling(headset,sub.mask);
  if(ceiling.source==='measured') return {L:ceiling.L, R:ceiling.R};
  if(ceiling.source==='model') return sym(reference);
  /* A link carries totals only, so the model's shape is stretched to match them. */
  const modelTotal = modelTotals(headset,sub.mask);
  const across = ceiling.totals.H/modelTotal.H, tall = ceiling.totals.V/modelTotal.V, corner = ceiling.totals.diag/modelTotal.diag;
  return sym({temp:reference.temp*across, nasal:reference.nasal*across, up:reference.up*tall, down:reference.down*tall,
    dut:reference.dut*corner, ddt:reference.ddt*corner, dun:reference.dun*corner, ddn:reference.ddn*corner});
}
function ceilingSourceText(sub,yours=false){
  if(sub.ceiling.source==='measured') return 'measured';
  if(sub.ceiling.source==='link') return yours?'from your link':'from the link';
  return `model reference, ${sub.mask==='on'&&headsetById[sub.headset].renderedMasked?'with corner mask':'full frame'}`;
}
function maskWords(sub){
  if(sub.mask==='on') return 'detected';
  if(sub.mask==='off') return 'probably off';
  return sub.tool==='ATLAS'?'not reported':'unknown';
}

const FACE = {
  depth:{label:'Eyes vs brow', opts:{deep:'Deep-set',average:'In between',flush:'Almost flush'},
         hint:{deep:'Eyes sit well behind the brow',average:'Eyes a little behind the brow',flush:'Eyes and brow almost level'}},
  nose:{label:'Nose bridge', opts:{low:'Low',average:'In between',high:'High'}, hint:{low:'Flat between the eyes',average:'Neither flat nor sticking out',high:'Sticks out between the eyes'}},
};
const TUNING = {stock:'Stock', modded:'Physically modded', tuned:'Driver tuned', both:'Modded + tuned'};
const tuningOf = (sub)=> sub.modded&&sub.tuned?'both':sub.modded?'modded':sub.tuned?'tuned':'stock';

/* ---------- Sample submissions (deterministic) ---------- */
function mulberry32(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const HANDLE_PARTS = [['lens','pixel','orbit','quiet','retro','nova','fern','vector','amber','delta'],['fox','moth','pilot','owl','wren','otter','drift','spark','lynx','kite']];
const SUBS = (()=>{
  const rng = mulberry32(11), pick = (list)=>list[Math.floor(rng()*list.length)];
  /* Separate generator, so adding authors leaves the sample measures unchanged. */
  const nameRng = mulberry32(7), handle = ()=>HANDLE_PARTS.map((parts)=>parts[Math.floor(nameRng()*parts.length)]).join('-')+(nameRng()<.5?Math.floor(nameRng()*90+10):'');
  const subs=[]; let nextId=1;
  for(const headset of HEADSETS) for(const tool of Object.keys(headset.peak)){
    const count = 5+Math.floor(rng()*8);
    for(let index=0; index<count; index++){
      const first = index===0;
      const sub = {id:nextId++, headset:headset.id, tool,
        depth: first?'flush':pick(['deep','average','average','flush']),
        nose: pick(['low','average','average','high']),
        modded: !first && rng()<.18, tuned: !first && rng()<.22,
        gaze: first||rng()<.8?'fixed':'free', ipd: 60+Math.round(rng()*10),
        mine: headset.id==='beyond2' && first, author: handle(), issue: 100+nextId*3};
      if(tool==='ATLAS'){
        /* No mask mesh from the browser means "not reported": the mask may be off, or the browser may not say. */
        sub.mask = first||rng()<.75?'on':'unknown';
        const frame = modelCeiling(headset,sub.mask);
        const read = ()=>Object.fromEntries(Object.entries(frame).map(([key,value])=>[key,Number(value.toFixed(2))]));
        sub.ceiling = {source:'measured', L:read(), R:read(), canting:0};
      } else if(tool==='VRHP'){
        const runtimeMask = headset.diag&&rng()<.5?'off':'on', totals = modelTotals(headset,runtimeMask);
        sub.ceiling = {source:'link', totals:{H:Number(totals.H.toFixed(2)), V:Number(totals.V.toFixed(2)), diag:Number((totals.diag+rng()-.5).toFixed(2))}};
        sub.mask = linkMask(headset,sub.ceiling.totals);
      } else {
        sub.ceiling = {source:'model'}; sub.mask = 'unknown';
      }
      const ceilings = ceilingProfiles(sub);
      const loss = first?0:{deep:4,average:2,flush:.5}[sub.depth]+(sub.gaze==='free'?1.5:0)-(sub.modded?1.5:0);
      for(const side of ['L','R']){
        const place = side==='L'?leftEye:rightEye;
        const peak = place(headset.peak[tool][side]), ceiling = place(ceilings[side]);
        sub[side] = {};
        for(const dir of TOOLS[tool].dirs[side]){
          let value = first?peak[dir]:peak[dir]-Math.max(0,loss+rng()*3-.5);
          value = Math.min(value, ceiling[dir]);
          sub[side][dir] = Number((Math.round(value/TOOLS[tool].step)*TOOLS[tool].step).toFixed(2));
        }
      }
      if(TOOLS[tool].binocular){
        const half=Math.min(sub.L.L,sub.R.R), up=Math.min(sub.L.U,sub.R.U), down=Math.min(sub.L.D,sub.R.D);
        sub.L={L:half,U:up,D:down}; sub.R={R:half,U:up,D:down};
      }
      subs.push(sub);
    }
  }
  return subs;
})();

/* ---------- Metrics ---------- */
function metrics(sub){
  const H = sub.L.L+sub.R.R, overlap = sub.L.R!=null&&sub.R.L!=null?sub.L.R+sub.R.L:null;
  const V = Math.max(sub.L.U+sub.L.D, sub.R.U+sub.R.D);
  const diagonals = [sub.L.DL,sub.L.UL,sub.R.UR,sub.R.DR].filter((value)=>value!=null);
  const diag = diagonals.length?Math.max(...diagonals):null;
  return {H, V, diag, overlap, overlapPct: overlap==null?null:overlap/H*100};
}
/* Highest value of a metric across rows, or null when the tool doesn't measure it. */
function highestOf(rows,key){const values=rows.map((row)=>row.m[key]).filter((value)=>value!=null); return values.length?Math.max(...values):null}
const mean = (values)=>values.reduce((sum,value)=>sum+value,0)/values.length;
const sd = (values)=>{const avg=mean(values);return Math.sqrt(mean(values.map((value)=>(value-avg)**2)))};
const fmt = (value,digits=1)=>value==null||isNaN(value)?'—':value.toFixed(digits);

/* ---------- State ---------- */
const state = {
  compareTool:null, columns:new Set(['maxH','maxV','diag','overlap','overlapPct']), sort:{key:'maxH',dir:-1},
  filters:{depth:new Set(),nose:new Set(),tuning:new Set(),gaze:new Set()},
  compareView:'table', radar:{headsets:new Set(), big:false, eye:'union', stat:'peak', ceiling:'full', view:'shape', scene:'room', through:null},
  headsetTool:null, headsetPicks:new Set(),
  wiz:{step:0, tool:'VRHP', headset:'beyond2', L:{}, R:{}, depth:null, nose:null, measured:false, ceiling:null, mask:'unknown',
       modded:false, tuned:false, details:'', gaze:'fixed', ipd:'', cushion:'', paste:'', pasteMsg:''},
};

function passes(sub){
  const filters = state.filters;
  const test = (set,value)=>!set.size||set.has(value);
  return test(filters.depth,sub.depth)&&test(filters.nose,sub.nose)
      && test(filters.tuning,tuningOf(sub))&&test(filters.gaze,sub.gaze);
}
const subsFor = (headsetId,tool,filtered=true)=>SUBS.filter((sub)=>sub.headset===headsetId&&sub.tool===tool&&(!filtered||passes(sub)));

/* ---------- Radar ---------- */
function combine(left,right,mode){
  if(mode==='left') return left; if(mode==='right') return right;
  const out={};
  for(const [dir] of DIRS){
    const a=left[dir], b=right[dir];
    if(mode==='union'){ if(a!=null||b!=null) out[dir]=Math.max(a??-1,b??-1); }
    else if(a!=null&&b!=null) out[dir]=Math.min(a,b);
  }
  return out;
}
function aggregateEye(subs,side,stat){
  const out={};
  for(const [dir] of DIRS){
    const values = subs.map((sub)=>sub[side][dir]).filter((value)=>value!=null);
    if(values.length) out[dir] = stat==='peak'?Math.max(...values):mean(values);
  }
  return out;
}
const RMAX = 70;
function polar(cx,cy,scale,angle,value){const rad=angle*Math.PI/180;return [cx+value*scale*Math.cos(rad), cy-value*scale*Math.sin(rad)]}
function smoothPath(points){
  if(points.length<3) return '';
  const count=points.length, at=(index)=>points[(index+count)%count];
  let path=`M${at(0)[0].toFixed(1)},${at(0)[1].toFixed(1)}`;
  for(let index=0; index<count; index++){
    const p0=at(index-1),p1=at(index),p2=at(index+1),p3=at(index+2);
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];

  if(!tool||picks.size||state.compareView!=='radar') return;
  HEADSETS.map((headset)=>({headset,subs:headset.peak[tool]?subsFor(headset.id,tool).map((sub)=>({sub,m:metrics(sub)})):[]}))
    .filter((entry)=>entry.subs.length)
    .sort((first,second)=>COLUMNS.maxH.get(second.subs,second.headset)-COLUMNS.maxH.get(first.subs,first.headset))
    .slice(0,2).forEach((entry)=>picks.add(entry.headset.id));
}

/* Each series is one shape on the radar: a headset's aggregate on Compare, or the aggregate and ticked submissions on a headset page.
   Series without values (no matching measures) still contribute their ceiling. */
function compareSeries(tool){
  const radar=state.radar, statWord=radar.stat==='peak'?'highest':'mean';
  return HEADSETS.filter((headset)=>radar.headsets.has(headset.id)).map((headset)=>{
    const subs=headset.peak[tool]?subsFor(headset.id,tool):[];
    return {key:headset.id, name:headset.name, color:headset.color,
      ceiling:(eyeMode)=>ceilingCurve(headset,eyeMode,radar.ceiling==='masked'),
      ...(subs.length?{left:aggregateEye(subs,'L',radar.stat), right:aggregateEye(subs,'R',radar.stat),
        label:`${headset.name} · ${statWord} (n=${subs.length})`, seeText:`the ${statWord} shape measured on the ${headset.name}`}:{})};
  });
}
const PICK_COLORS=['#e0447a','#2bb3a3','#f0a030','#7a5cff','#3d8bfd'];
function headsetSeries(headset,tool){
  const radar=state.radar, statWord=radar.stat==='peak'?'highest':'mean', subs=subsFor(headset.id,tool);
  const series=[{key:'all', name:`Everyone (${statWord})`, color:headset.color,
    ceiling:(eyeMode)=>ceilingCurve(headset,eyeMode,radar.ceiling==='masked'),
    ...(subs.length?{left:aggregateEye(subs,'L',radar.stat), right:aggregateEye(subs,'R',radar.stat),
      label:`Everyone · ${statWord} (n=${subs.length})`, seeText:`the ${statWord} shape of everyone who matches the filters`}:{})}];
  [...state.headsetPicks].map((id)=>subs.find((sub)=>sub.id===id)).filter(Boolean).forEach((sub,pickIndex)=>{
    const color=PICK_COLORS[pickIndex%PICK_COLORS.length];
    series.push({key:`sub${sub.id}`, name:`#${sub.id} · ${sub.author}`, color, left:sub.L, right:sub.R,
      ceiling:(eyeMode)=>subCeilingCurve(sub,eyeMode,`#${sub.id}`),
      label:`Submission #${sub.id}`, seeText:`submission #${sub.id}`});
  });
  return series;
}

function radarParts(tool,series,{headsetChips=false,empty}={}){
  const radar=state.radar, curves=[], see=radar.view==='see', shapes=series.filter((item)=>item.left);
  const binocular=TOOLS[tool].binocular, eyeMode=binocular?'union':radar.eye;
  for(const item of series){
    if(radar.ceiling!=='off') curves.push(Object.assign(item.ceiling(eyeMode),{color:item.color}));
    if(item.left) curves.push({key:item.key, eye:combine(item.left,item.right,eyeMode), color:item.color, fill:!see, label:item.label});
  }
  let seeBar='', seeCaption='';
  if(see&&shapes.length){
    if(!shapes.some((shape)=>shape.key===radar.through)) radar.through=shapes[0].key;
    const shown=shapes.find((shape)=>shape.key===radar.through);
    Object.assign(curves.find((curve)=>curve.key===radar.through),{window:true,width:2.8});
    if(eyeMode==='union') curves.push({eye:combine(shown.left,shown.right,'overlap'),color:'#f5c542',dash:'3 3',width:1.6,dots:false,
      label:`${shown.name} · seen by both eyes (3D)`});
    if(shapes.length>1) seeBar=`<div class="fgroup"><div class="lbl">Looking through</div>${seg(radar.through,Object.fromEntries(shapes.map((shape)=>[shape.key,shape.name])),'radarThrough')}</div>`;
    const eyeWords={union:'both eyes together',overlap:'only what both eyes see',left:'left eye',right:'right eye'}[eyeMode];
    seeCaption=`<p class="small muted" style="margin:10px 0 0">You're looking straight ahead. Clear: inside ${shown.seeText} (${eyeWords}). Dimmed: there, but outside it. Each ring is 10° further from straight ahead, so straight edges bend as in a fisheye photo. The scenes are generic sketches.</p>`;
  }
  const options=`<div class="card">
      ${headsetChips?`<div class="fgroup"><div class="lbl">Headsets</div><div class="chips">${HEADSETS.map((headset)=>chip(radar.headsets.has(headset.id),`data-a="radarHeadset" data-v="${headset.id}"`,`<span class="dot" style="background:${headset.color};margin-right:5px"></span>${headset.name}${headset.peak[tool]?'':' <span class="small">(no data)</span>'}`,!headset.peak[tool])).join('')}</div></div>`:''}
      <div class="fgroup"><div class="lbl">Eye</div>${binocular?`<p class="small muted" style="margin:0">${TOOLS[tool].name} measures both eyes together.</p>`:seg(radar.eye,{left:'Left',right:'Right',union:'Union',overlap:'Overlap'},'radarEye')}</div>
      <div class="fgroup"><div class="lbl">Statistic</div>${seg(radar.stat,{peak:'Highest',mean:'Mean'},'radarStat')}</div>
      <div class="fgroup"><div class="lbl">Rendered ceiling</div>${seg(radar.ceiling,{full:'Full frame',masked:'Corner mask',off:'Hide'},'radarCeiling')}
        <p class="small muted" style="margin:6px 0 0">${MASK_HINT} Only models with a known corner-mask figure change; a single submission keeps its own.</p></div>
    </div><div style="height:16px"></div>`;
  const body=`<div class="card${radar.big?' big':''}">
      <div class="viewbar">${seg(radar.view,{shape:'Shape',see:'What you see'},'radarView')}
        ${see?seg(radar.scene,Object.fromEntries(Object.entries(SCENES).map(([key,scene])=>[key,scene.name])),'radarScene'):''}
        <button class="btn ghost" data-a="radarBig" title="${radar.big?'Back to the page (Esc)':'Fill the window'}">${radar.big?'✕ Close':'⤢ Enlarge'}</button></div>
      ${seeBar}
      ${curves.length?radarSVG(curves,see?radar.scene:null):`<div class="empty">${empty}</div>`}
      ${seeCaption}
    </div>`;
  return {options,body};
}

function viewHeadset(id){
  const headset=headsetById[id]; if(!headset) return '<p>Unknown headset.</p>';
  const tools=Object.keys(TOOLS).filter((key)=>key in headset.peak);
  if(!tools.includes(state.headsetTool)) state.headsetTool = tools.includes(state.compareTool)?state.compareTool:tools[0];
  const tool=state.headsetTool, subs=subsFor(id,tool), all=subsFor(id,tool,false);
  const {options,body}=radarParts(tool,headsetSeries(headset,tool),{empty:'<b>Nothing to draw</b>No measure matches the filters.'});
  const best = subs.length?Math.max(...subs.map((sub)=>metrics(sub).H)):null;
  return `<p><a href="#compare">← Compare</a></p>
    <h1><span class="dot" style="background:${headset.color};width:14px;height:14px"></span>${headset.name}</h1>
    <div class="fgroup">${seg(tool,Object.fromEntries(tools.map((key)=>[key,TOOLS[key].name])),'headsetTool')}</div>
    <div class="kpis" style="margin-bottom:16px">
      <div class="kpi"><div class="v">${fmt(best)}°</div><div class="l">Highest horizontal</div></div>
      <div class="kpi"><div class="v">${fmt(headset.rendered.temp*2)}°</div><div class="l">Rendered horizontal</div></div>
      ${headset.diag?`<div class="kpi"><div class="v">${fmt(headset.diag.full)}°</div><div class="l">Rendered diagonal (${fmt(headset.diag.masked)}° with corner mask)</div></div>`:''}
      <div class="kpi"><div class="v">${subs.length}<span class="small muted"> / ${all.length}</span></div><div class="l">Submissions (filtered / all)</div></div>
    </div>
    <div class="side"><div>${options}${filtersPanel(tool)}</div><div>
      ${body}
      <h2>Individual submissions</h2>
      <p class="small muted">Tick measures to put them on the radar next to everyone's, each with its own rendered ceiling, then pick one under “Looking through” in What you see. Your own measures are the ones with your GitHub name; it links to the GitHub page where each was sent. ${MASK_HINT}</p>
      <div class="tablewrap"><table><thead><tr><th class="pick" title="Tick to show on the radar"></th><th>#</th><th>Sent by</th><th>Eyes vs brow</th><th>Nose bridge</th><th>Tuning</th><th>Gaze</th><th>IPD</th><th>Horiz.</th><th>Vert.</th><th>Overlap</th><th>Rendered ceiling</th></tr></thead><tbody>
      ${subs.map((sub)=>{const m=metrics(sub), on=state.headsetPicks.has(sub.id);return `<tr data-a="pickSub" data-v="${sub.id}"><td class="pick"><input type="checkbox" aria-label="Show submission ${sub.id} on the radar" ${on?'checked':''}></td><td>${sub.id}</td><td><a href="#" onclick="event.preventDefault();event.stopPropagation()" title="Opens GitHub issue #${sub.issue} (mockup)">${sub.author}</a></td>
        <td title="${FACE.depth.hint[sub.depth]}">${FACE.depth.opts[sub.depth]}</td><td title="${FACE.nose.hint[sub.nose]}">${FACE.nose.opts[sub.nose]}</td>
        <td>${TUNING[tuningOf(sub)]}</td><td>${sub.gaze}</td><td>${sub.ipd}</td><td>${fmt(m.H)}°</td><td>${fmt(m.V)}°</td><td>${m.overlap==null?"—":fmt(m.overlap)+"°"}</td>
        <td>${ceilingSourceText(sub)}<span class="tag">corner mask ${maskWords(sub)}</span></td></tr>`}).join('')}
      </tbody></table></div></div></div>`;
}

const STEPS=['Tool','Headset','Values','Face fit','Setup','Review'];
const stepsFor=(wiz)=>wiz.tool==='ATLAS'?[1,3,4,5]:[0,1,2,3,4,5];
const IMPORT_TOOLS=Object.fromEntries(Object.entries(TOOL_NAMES).filter(([key])=>key!=='ATLAS'));
/* Side profiles facing right: brow ridge on top, the eye below it sits further back the deeper it is set. */
function faceDrawing(key,value){
  if(key==='depth'){
    const eyeX = {deep:72, average:77, flush:82}[value];
    return `<svg viewBox="40 8 70 58"><path d="M60 10 Q78 12 84 26 Q${eyeX-2} 32 ${eyeX} 38 Q${eyeX+4} 44 86 50" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="${eyeX-4}" cy="37" rx="3" ry="4" fill="currentColor"/><line x1="84" y1="26" x2="84" y2="52" stroke="var(--muted)" stroke-dasharray="2 2"/></svg>`;
  }
  const bridge = {low:'M78 22 Q84 30 86 52 L80 56', average:'M79 21 Q89 31 90 52 L81 56', high:'M80 20 Q94 32 94 52 L82 56'}[value];
  return `<svg viewBox="40 8 70 58"><path d="${bridge}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="70" cy="30" rx="3" ry="4" fill="currentColor"/></svg>`;
}
function decodeVRHP(text){
  const match=text.match(/results=([A-Za-z0-9_-]+)/);
  let b64=(match?match[1]:text.trim()).replace(/-/g,'+').replace(/_/g,'/'); while(b64.length%4) b64+='=';
  const bytes=Uint8Array.from(atob(b64),(char)=>char.charCodeAt(0));
  if(bytes.length<22) throw new Error('too short');
  const view=new DataView(bytes.buffer), at=(index)=>view.getInt16(2+index*2,true)/100;
  const eyes={L:{L:at(0),R:at(1),U:at(2),D:at(3),DL:at(4)}, R:{L:at(5),R:at(6),U:at(7),D:at(8),UR:at(9)}};
  /* After the ten measured angles come nine rendered totals (uint16 centi-degrees): left H, left V, right H, right V,
     binocular H, H overlap, V, V overlap, diagonal. */
  if(bytes.length>=40){
    const total=(index)=>view.getUint16(22+index*2,true)/100;
    eyes.totals={leftH:total(0),leftV:total(1),rightH:total(2),rightV:total(3),H:total(4),overlapH:total(5),V:total(6),overlapV:total(7),diag:total(8)};
  }
  return eyes;
}
function encodeVRHP(sub){
  const values=[sub.L.L,sub.L.R,sub.L.U,sub.L.D,sub.L.DL,sub.R.L,sub.R.R,sub.R.U,sub.R.D,sub.R.UR];
  const totals=sub.ceiling.totals;
  const totalValues=totals?[totals.leftH??0,totals.leftV??0,totals.rightH??0,totals.rightV??0,totals.H,totals.overlapH??0,totals.V,totals.overlapV??0,totals.diag]:[];
  const bytes=new Uint8Array(2+values.length*2+totalValues.length*2); bytes[0]=4; const view=new DataView(bytes.buffer);
  values.forEach((value,index)=>view.setInt16(2+index*2,Math.round(value*100),true));
  totalValues.forEach((value,index)=>view.setUint16(22+index*2,Math.round(value*100),true));
  return 'https://vrheadsetpicker.example/measure-your-fov/results?results='+btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeWIMFOV(text){
  const match=text.match(/points"?\s*[:=]\s*"?([\d.,\s|]+)/);
  const sides=(match?match[1]:text).split('|').map((part)=>part.split(',').map(Number));
  if(sides.length<2||sides.some((list)=>list.length<8||list.some(isNaN))) throw new Error('need left|right with 16 values each');
  const toEye=(list)=>({U:list[0],L:list[1],D:list[2],R:list[3],UL:list[4],DL:list[5],DR:list[6],UR:list[7]});
  return {L:toEye(sides[0]),R:toEye(sides[1])};
}
const mineSub = (tool)=>SUBS.find((sub)=>sub.mine&&sub.tool===tool);
function wimfovExample(sub){
  const raw=(eye)=>[eye.U,eye.L,eye.D,eye.R,eye.UL,eye.DL,eye.DR,eye.UR,...Array(8).fill(0)].join(',');
  return `"points":"${raw(sub.L)}|${raw(sub.R)}"`;
}
function eyeGrid(side){
  const wiz=state.wiz, allowed=TOOLS[wiz.tool].dirs[side];
  const cell=(dir)=>`<input type="number" step="${TOOLS[wiz.tool].step}" data-in="val" data-side="${side}" data-dir="${dir}" value="${wiz[side][dir]??''}" ${allowed.includes(dir)?'':'disabled placeholder="n/a"'} title="${DIR_NAME[dir]}">`;
  return `<div><div class="lbl small muted" style="text-align:center;margin-bottom:6px">${side==='L'?'Left':'Right'} eye</div><div class="eyegrid">
    ${cell('UL')}${cell('U')}${cell('UR')}${cell('L')}<div class="c">ahead</div>${cell('R')}${cell('DL')}${cell('D')}${cell('DR')}</div></div>`;
}
function wizReady(step){
  const wiz=state.wiz;
  if(step===2) return ['L','R'].every((side)=>TOOLS[wiz.tool].dirs[side].every((dir)=>wiz[side][dir]!=null));
  if(step===3) return wiz.depth&&wiz.nose;
  return true;
}
function wizSubmission(){
  const wiz=state.wiz, mine={headset:wiz.headset, tool:wiz.tool, L:wiz.L, R:wiz.R};
  if(wiz.tool==='ATLAS'&&wiz.ceiling) return {...mine, ceiling:wiz.ceiling, mask:wiz.mask};
  if(wiz.tool==='VRHP'&&wiz.ceiling) return {...mine, ceiling:wiz.ceiling, mask:linkMask(headsetById[wiz.headset],wiz.ceiling.totals)};
  return {...mine, ceiling:{source:'model'}, mask:'unknown'};
}

    <div class="note" style="margin-bottom:16px">You'll need a free GitHub account to send your measure: that's what lets you remove it later. <a href="https://github.com/signup" target="_blank" rel="noopener">Create one</a> (1 minute)${measured?'':' before you start'} if you don't have one.</div>
    <div class="side"><div class="card steps">${steps.map((index,order)=>`<button class="${index===wiz.step?'on':order<position?'done':''}" data-a="wizGo" data-v="${index}" ${order>position&&!steps.slice(0,order).every((prev)=>wizReady(prev))?'disabled':''}>${order+1}. ${STEPS[index]}</button>`).join('')}</div>
    <div class="card">${panel}
      <div style="display:flex;justify-content:space-between;margin-top:20px">
        <button class="btn ghost" data-a="wizGo" data-v="${steps[Math.max(position-1,0)]}" ${position===0?'disabled':''}>Back</button>
        ${position<steps.length-1?`<button class="btn" data-a="wizGo" data-v="${steps[position+1]}" ${wizReady(wiz.step)?'':'disabled'}>Next</button>`:''}
      </div></div></div>`;
}

function viewHome(){
  return `<div style="max-width:760px;margin:30px auto 0;text-align:center">
    <h1 style="font-size:34px">How much do people really see in each VR headset?</h1>
    <p class="muted" style="font-size:17px">Field of view measured by real people, with their face fit and setup, next to what the headset renders.</p></div>
    <div class="home-buttons">
      <a class="big" href="#measure"><span class="ic">◉</span><b>Measure my FOV</b><span class="muted">Right here, in your headset's browser. About 3 minutes.</span></a>
      <a class="big" href="#compare"><span class="ic">▦</span><b>Compare headsets</b><span class="muted">Pick a measuring tool, then rank headsets side by side.</span></a>
      <a class="big" href="#compare/radar"><span class="ic">◎</span><b>Overlay shapes</b><span class="muted">See several headsets' field of view on one radar.</span></a>
      <a class="big" href="#submit"><span class="ic">＋</span><b>Add a measure</b><span class="muted">Already measured with another tool? Paste it here.</span></a>
      <a class="big" href="#method"><span class="ic">?</span><b>How it works</b><span class="muted">What the numbers mean, in two minutes.</span></a>
    </div>`;
}

function viewMethod(){
  return `<div class="prose"><h1>How it works</h1>
    <h2>Why this site exists</h2>
    <p>As a random person about to buy a VR headset, how do you get a good idea of the field of view you'll actually get? Today, you can't really.</p>
    <ul><li><b>What's rendered isn't what you see.</b> <a href="https://github.com/risa2000/hmdq" target="_blank" rel="noopener">hmdq</a> reads what a headset displays (there's a small <a href="https://risa2000.github.io/hmdgdb/" target="_blank" rel="noopener">dataset</a> of its results). That's the last word: nobody sees more than that. What reaches your eyes is usually less.</li>
    <li><b>The tools disagree.</b> <a href="https://vrheadsetpicker.com/" target="_blank" rel="noopener">VR Headset Picker</a> and <a href="https://knob2001.itch.io/testhmd" target="_blank" rel="noopener">TestHMD</a> follow hmdq's convention but don't measure the same way: TestHMD's tiny dot can vanish on headsets like the Bigscreen Beyond or the Pimax Dream Air while a line would still show. <a href="https://boll.itch.io/wimfov" target="_blank" rel="noopener">WIMFOV</a> uses its own standard, so its numbers differ a lot, but its radar shows best what you see. Some VRChat worlds measure too, with no clear standard at all.</li>
    <li><b>Faces differ.</b> Flat face or deep-set eyes, nose, brow, the facial interface and its cushion: all of them change how close your eyes sit to the lenses, and so how much you see. Driver settings are another matter: they change how much the headset draws, not how it sits on your face. One person's result can be far out of reach for someone else. The measures of whoever started this site, a Pimax Dream Air almost as wide as a Crystal Super, are far more optimistic than most people should expect.</li>
    <li><b>Pooled results mislead.</b> When every measure is mixed together, a single one can put a headset at the top of a ranking: one submission once made the Vive Pro 1 the headset with the biggest overlap of all, while the same person's even bigger overlap on a Pimax Dream Air got lost in the mass.</li></ul>
    <p>So here, everyone adds their measure with the tool they used and a few simple details about their face and setup. You then look at measures from people whose headset probably fits them the way it fits you, one tool at a time, to get a better idea of what to expect: the average, how much it varies, and the highest anyone has measured, under what hmdq says the headset renders.</p>
    <h2>What we measure</h2>
    <p>Field of view (FOV) is how much of the image you actually see, in degrees. Headset makers advertise one number, but what you really get depends on your face and on how the headset sits on it. That's what this site collects.</p>
    <h2>How a measure works</h2>
    <p>Each eye is measured on its own while the other screen stays dark. A marker moves in from the edge of the image, and you signal when you see it. That gives an angle for each direction: left, right, up, down and the diagonals in between. On the radar, these angles are joined into the shape of what you see.</p>
    <h2>Staring ahead or looking around</h2>
    <p>You choose. Keeping your eyes on the centre dot usually gives the widest result. Glancing toward the marker tends to give a little less, because the lens image shifts as your eye turns. You say which one you did, and everyone can filter on it.</p>
    <h2>Reading the numbers</h2>
    <ul><li><b>Horizontal</b>: from the far left your left eye sees to the far right your right eye sees.</li>
    <li><b>Vertical</b>: from top to bottom, for the eye that sees more.</li>
    <li><b>Overlap</b>: the part both eyes see at once. That's where things look 3D.</li></ul>
    <h2>One tool at a time</h2>
    <p>You can measure here, or with VR Headset Picker or WIMFOV. Each tool gives slightly different numbers, even for the same person in the same headset, a bit like shoe sizes from two brands.</p>
    <p>So you always pick one tool, and everything you see comes from that tool only. Numbers from different tools are never shown together.</p>
    <p>One reason they differ is how each tool decides you've reached the edge:</p>
    <ul><li><b>FOV Atlas</b> and <b>VR Headset Picker</b> keep asking “can you still see the line?” and keep the last spot you said yes to.</li>
    <li><b>WIMFOV</b> lets you push the marker out yourself, as far as you like, and submit whenever you choose: where you stop is up to you.</li>
    <li><b>TestHMD</b> moves a dot out to both sides at once until you can't see it, without saying exactly when to stop. It's a rough measure: both eyes together, horizontal and vertical only, with no single-eye values, overlap or diagonal. On headsets whose view reaches a bit further just above or below the middle line (like the Bigscreen Beyond or the Pimax Dream Air), it can miss that extra bit.</li></ul>
    <h2>The dotted line</h2>
    <p>That's what the headset actually displays. Nobody can see past it, so it's the best anyone can get.</p>
    <p>A measure made here carries its own dotted line, read from your headset while you measure. A VR Headset Picker link carries the headset's totals, so the line is fitted to those. Otherwise it's the reference for that headset model. Many headsets also skip drawing the corners the lens hides anyway: the <b>corner mask</b>. It trims the diagonals a little and barely changes left, right, up or down. You never need to know whether yours is on: we note it when we can tell, and use the full image when we can't.</p>
    <h2>Why your face matters</h2>
    <p>Deep-set eyes sit further from the lenses and see less. That's why each measure comes with a few simple questions about your face, so you can get a better idea of what to expect from people whose headset probably fits them the way it fits you.</p>
    <h2>Sending your result</h2>
    <p>You send it with a free GitHub account. Your GitHub name is shown next to your measure, and you can remove it any time.</p></div>`;
}

function viewMeasure(){
  return `<h1>Measure my FOV</h1>
    <div class="grid2">
      <div class="card">
        <h2 style="margin-top:0">How it goes</h2>
        <ol>
          <li>Open this page in your headset's browser.</li>
          <li>Choose how you look: at the dot in the middle the whole time (usually the widest result), or free to glance at the line.</li>
          <li>Press <b>Start</b>.</li>
          <li>A line appears somewhere toward the edge and stays still. Can you still see it? Turn your head a little toward <b>Yes</b> or <b>No</b> and hold until the ring fills. No controller needed, though its buttons work too.</li>
          <li>The line jumps to a new spot after each answer, halving the gap each time, until it settles on the last spot you can still see.</li>
          <li>8 directions, then the other eye. About 3 minutes.</li>
        </ol>
        <p class="small muted">Works in the Quest browser, and on PC in Chrome or Edge with SteamVR running. The page also reads what your headset displays, so the dotted line is exactly yours.</p>
        <p><button class="btn" disabled title="Needs a headset">Start in VR</button>
           <button class="btn ghost" data-a="simulateMeasure">Pretend I just finished</button></p>
        <p class="small muted">When you finish, a few questions about your face and setup, then you publish it. No copying numbers around.</p>
      </div>
      <div class="card">
        <div class="lbl small muted" style="margin-bottom:6px">What the left eye sees during a step</div>
        <svg viewBox="0 0 300 300" style="width:100%;max-width:360px;display:block;margin:auto;background:#000;border-radius:50%">
          <circle cx="150" cy="150" r="4" fill="#fff"/>
          <rect x="38" y="20" width="4" height="260" fill="#6d9bff"/>
          <text x="150" y="132" text-anchor="middle" fill="#888" font-size="12">look at the dot</text>
          <text x="150" y="196" text-anchor="middle" fill="#ccc" font-size="13">Can you still see the line?</text>
          <circle cx="112" cy="228" r="17" fill="none" stroke="#333" stroke-width="4"/>
          <circle cx="112" cy="228" r="17" fill="none" stroke="#6d9bff" stroke-width="4" stroke-dasharray="64 107" transform="rotate(-90 112 228)"/>
          <text x="112" y="232" text-anchor="middle" fill="#fff" font-size="11">Yes</text>
          <circle cx="188" cy="228" r="17" fill="none" stroke="#333" stroke-width="4"/>
          <text x="188" y="232" text-anchor="middle" fill="#fff" font-size="11">No</text>
        </svg>
        <p class="small muted" style="text-align:center">Here “Yes” is filling as the head turns slightly toward it. The line moves with your head, so turning it doesn't change what you're judging. The right eye's screen stays black meanwhile.</p>
      </div>
    </div>${renderedViewCard()}`;
}
function renderedViewCard(){
  const wiz=state.wiz, example=!(wiz.measured&&wiz.ceiling);
  const source=example?mineSub('ATLAS'):{tool:'ATLAS',ceiling:wiz.ceiling,mask:wiz.mask}, ceiling=source.ceiling;
  const row=(label,profile)=>`<tr style="cursor:default"><td>${label}</td><td>${fmt(profile.temp,2)}°</td><td>${fmt(profile.nasal,2)}°</td><td>${fmt(profile.up,2)}°</td><td>${fmt(profile.down,2)}°</td></tr>`;
  return `<div class="card" style="margin-top:16px">
    <h2 style="margin-top:0">Your headset's rendered view, read automatically${example?' <span class="tag">example</span>':''}</h2>
    <p class="small muted">How far your headset draws the image for each eye, read from the browser while you measure. Nobody can see past it.</p>
    <div class="tablewrap"><table><thead><tr><th>Eye</th><th>Toward the ear</th><th>Toward the nose</th><th>Up</th><th>Down</th></tr></thead>
      <tbody>${row('Left',ceiling.L)}${row('Right',ceiling.R)}</tbody></table></div>
    <p class="small">Screens angled outward (canting): <b>${fmt(ceiling.canting)}°</b> · Corner mask: <b>${maskWords(source)}</b></p>
    <p class="small muted" style="margin-bottom:0">${MASK_HINT}${source.mask==='on'?'':' “Not reported” means the browser didn\'t say: it may be off, or the browser may not tell.'}</p>
  </div>`;
}

/* ---------- Router & events ---------- */
const PAGES={home:'Home',measure:'Measure',compare:'Compare',submit:'Add a measure',method:'How it works'};
function render(){
  const [page,arg]=(location.hash.slice(1)||'home').split('/');
  document.getElementById('nav').innerHTML=Object.entries(PAGES).map(([key,label])=>`<a href="#${key}" class="${key===page||(page==='headset'&&key==='compare')?'on':''}">${label}</a>`).join('');
  if(page==='compare'){state.compareView=arg==='radar'?'radar':'table'; autoPick()}
  if(page!=='headset'&&(page!=='compare'||state.compareView!=='radar')) state.radar.big=false;
  const views={home:viewHome,measure:viewMeasure,compare:viewCompare,submit:viewSubmit,method:viewMethod,headset:()=>viewHeadset(arg)};
  document.getElementById('app').innerHTML=(views[page]||viewHome)();
}
const toggle=(set,value)=>set.has(value)?set.delete(value):set.add(value);
const ACTIONS={
  compareTool:(value)=>{state.compareTool=value; autoPick()},
  filter:(value,key)=>{const set=state.filters[key]; toggle(set,value);
    if(set.size===Object.keys(FILTER_OPTIONS[key]).length) set.clear()},
  filterAny:(value,key)=>state.filters[key].clear(),
  clearFilters:()=>Object.values(state.filters).forEach((set)=>set.clear()),
  column:(value)=>{toggle(state.columns,value); if(!state.columns.size) state.columns.add('maxH')},
  sort:(value)=>state.sort={key:value,dir:state.sort.key===value?-state.sort.dir:-1},
  openHeadset:(value)=>{state.headsetPicks.clear(); location.hash='headset/'+value},
  headsetTool:(value)=>{state.headsetTool=value; state.headsetPicks.clear()},
  pickSub:(value)=>toggle(state.headsetPicks,+value),
  compareView:(value)=>location.hash=value==='radar'?'compare/radar':'compare',
  simulateMeasure:()=>{const wiz=state.wiz, sub=mineSub('ATLAS');
    Object.assign(wiz,{tool:'ATLAS',headset:'beyond2',L:{...sub.L},R:{...sub.R},measured:true,ceiling:sub.ceiling,mask:sub.mask,step:1});
    location.hash='submit'},
  radarHeadset:(value)=>toggle(state.radar.headsets,value),
  pickHeadset:(value)=>toggle(state.radar.headsets,value),
  clearPicks:()=>state.radar.headsets.clear(),
  radarBig:()=>state.radar.big=!state.radar.big,
  radarEye:(value)=>state.radar.eye=value,
  radarStat:(value)=>state.radar.stat=value,
  radarCeiling:(value)=>state.radar.ceiling=value,
  radarView:(value)=>state.radar.view=value,
  radarScene:(value)=>state.radar.scene=value,
  radarThrough:(value)=>state.radar.through=value,
  wizTool:(value)=>{if(state.wiz.tool!==value){state.wiz.tool=value;state.wiz.measured=false;state.wiz.ceiling=null;state.wiz.mask='unknown';state.wiz.L={};state.wiz.R={};state.wiz.paste='';state.wiz.pasteMsg=''}},
  wizHeadset:(value)=>state.wiz.headset=value,
  wizFace:(value,key)=>state.wiz[key]=value,
  wizFlag:(value)=>state.wiz[value]=!state.wiz[value],
  wizGaze:(value)=>state.wiz.gaze=value,
  wizGo:(value)=>{if(stepsFor(state.wiz).includes(+value)) state.wiz.step=+value},
  discardMeasure:()=>{ACTIONS.wizTool('VRHP'); state.wiz.step=0},
  example:()=>{const wiz=state.wiz, sub=mineSub(wiz.tool); wiz.headset='beyond2'; wiz.paste=wiz.tool==='VRHP'?encodeVRHP(sub):wimfovExample(sub); ACTIONS.parse()},
  parse:()=>{const wiz=state.wiz; try{const eyes=wiz.tool==='VRHP'?decodeVRHP(wiz.paste):decodeWIMFOV(wiz.paste); wiz.L=eyes.L; wiz.R=eyes.R; wiz.ceiling=eyes.totals?{source:'link',totals:eyes.totals}:null; wiz.pasteMsg='✓ Imported'}catch(error){wiz.pasteMsg='Could not read it: '+error.message}},
};
document.addEventListener('click',(event)=>{
  const target=event.target.closest('[data-a]'); if(!target||target.disabled) return;
  ACTIONS[target.dataset.a](target.dataset.v,target.dataset.k); render();
});
document.addEventListener('input',(event)=>{const target=event.target; if(target.dataset.in==='paste') state.wiz.paste=target.value;});
document.addEventListener('change',(event)=>{
  const target=event.target, wiz=state.wiz;
  if(target.dataset.in==='val'){const value=parseFloat(target.value); if(isNaN(value)) delete wiz[target.dataset.side][target.dataset.dir]; else wiz[target.dataset.side][target.dataset.dir]=value; render()}
  if(target.dataset.in==='testhmd'){
    /* TestHMD shows the full width or height; each edge sits at half of it from straight ahead. */
    const value=parseFloat(target.value)/2, keys=target.dataset.axis==='horizontal'?[['L','L'],['R','R']]:[['L','U'],['L','D'],['R','U'],['R','D']];
    for(const [side,dir] of keys){ if(isNaN(value)) delete wiz[side][dir]; else wiz[side][dir]=value; }
    render();
  }
  if(target.dataset.in==='details') wiz.details=target.value;
  if(target.dataset.in==='ipd') wiz.ipd=target.value;
});
document.addEventListener('keydown',(event)=>{if(event.key==='Escape'&&state.radar.big){state.radar.big=false; render()}});
window.addEventListener('hashchange',render);
render();
</script>
