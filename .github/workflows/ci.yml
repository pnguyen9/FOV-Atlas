name: CI

on:
  push:
    branches: [main]
  # The submission workflow redeploys after it stores or removes a measure. Such a run changes
  # only data files, which the Action has already checked, so it skips the code checks.
  workflow_dispatch:
    inputs:
      data_only:
        description: Skip lint, typecheck, tests and audit; build and deploy only
        type: boolean
        default: false

# Every job starts read-only; only the deploy job is granted Pages rights.
permissions:
  contents: read

# A burst of submissions triggers one run each. A running deploy is left to finish; GitHub keeps
# only the newest waiting run per group and cancels the older waiting ones, and that newest run
# builds everything committed before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit shipped dependencies
        if: ${{ !inputs.data_only }}
        run: npm audit --omit=dev --audit-level=low
      - if: ${{ !inputs.data_only }}
        run: npm run check
      - if: ${{ inputs.data_only }}
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
